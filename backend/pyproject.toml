[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hisabai-backend"
version = "0.1.0"
description = "HisabAI Document-Assisted Accounting Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HisabAI Team" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.19",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.3",
    "pyjwt>=2.8.0",
    "rapidfuzz>=3.9.0",
    "pymupdf>=1.24.5",
    "pillow>=10.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.8",
]
vision = [
    "google-cloud-vision>=3.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
